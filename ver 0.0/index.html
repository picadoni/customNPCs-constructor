<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #4caf50;
            --accent-hover: #45a049;
            --border-color: #444;
            --input-bg: #3d3d3d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .section {
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .option-block {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }
        .btn-download:hover {
            background-color: var(--accent-hover);
        }
        .btn-download:active {
            transform: scale(0.99);
        }
        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Генератор Диалогов CustomNPCs Глашатай (Версия 0.0)</h1>
    
    <!-- Основные настройки -->
    <div class="section">
        <div class="section-title">Основные параметры диалога</div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="dialogId">ID Диалога (DialogId)</label>
                <input type="number" id="dialogId" value="1">
            </div>
            <div class="form-group">
                <label for="dialogTitle">Название диалога (DialogTitle)</label>
                <input type="text" id="dialogTitle" value="Start">
            </div>
        </div>

        <div class="form-group">
            <label for="dialogText">Текст NPC (DialogText)</label>
            <textarea id="dialogText">Hello {player},

Welcome to our village. I hope you enjoy your stay</textarea>
            <div class="hint">Можно использовать {player} для имени игрока. Для переноса строки используйте обычный Enter.</div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="dialogQuest">ID связанного Квеста (-1 если нет)</label>
                <input type="number" id="dialogQuest" value="-1">
            </div>
            <div class="form-group">
                <label for="dialogCommand">Консольная команда при открытии</label>
                <input type="text" id="dialogCommand" value="">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group checkbox-group">
                <input type="checkbox" id="dialogHideNPC">
                <label for="dialogHideNPC">Скрывать NPC (DialogHideNPC)</label>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="dialogShowWheel">
                <label for="dialogShowWheel">Показывать колесом (DialogShowWheel)</label>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="dialogDisableEsc">
                <label for="dialogDisableEsc">Запретить ESC (DialogDisableEsc)</label>
            </div>
        </div>
    </div>

    <!-- Варианты ответов игрока -->
    <div class="section">
        <div class="section-title">Варианты ответов игрока (Кнопки)</div>
        
        <!-- Опция 1 -->
        <div class="option-block">
            <div style="font-weight: bold; margin-bottom: 10px; color: #4caf50;">Кнопка 1 (Слот 0)</div>
            <div class="form-group">
                <label for="optTitle0">Текст ответа</label>
                <input type="text" id="optTitle0" value="Who are you?">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="optType0">Действие (OptionType)</label>
                    <select id="optType0">
                        <option value="1">Переход к диалогу (1)</option>
                        <option value="0">Закрыть диалог (0)</option>
                        <option value="2">Роль (2)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="optDialog0">ID следующего диалога</label>
                    <input type="number" id="optDialog0" value="3">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="optColor0">Цвет текста кнопки (Decimal)</label>
                    <input type="number" id="optColor0" value="14737632">
                </div>
                <div class="form-group">
                    <label for="optCmd0">Команда кнопки</label>
                    <input type="text" id="optCmd0" value="">
                </div>
            </div>
        </div>

        <!-- Опция 2 -->
        <div class="option-block">
            <div style="font-weight: bold; margin-bottom: 10px; color: #4caf50;">Кнопка 2 (Слот 1)</div>
            <div class="form-group">
                <label for="optTitle1">Текст ответа</label>
                <input type="text" id="optTitle1" value="Tell me something about this village">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="optType1">Действие (OptionType)</label>
                    <select id="optType1">
                        <option value="1">Переход к диалогу (1)</option>
                        <option value="0">Закрыть диалог (0)</option>
                        <option value="2">Роль (2)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="optDialog1">ID следующего диалога</label>
                    <input type="number" id="optDialog1" value="2">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="optColor1">Цвет текста кнопки (Decimal)</label>
                    <input type="number" id="optColor1" value="14737632">
                </div>
                <div class="form-group">
                    <label for="optCmd1">Команда кнопки</label>
                    <input type="text" id="optCmd1" value="">
                </div>
            </div>
        </div>

        <!-- Опция 3 -->
        <div class="option-block">
            <div style="font-weight: bold; margin-bottom: 10px; color: #4caf50;">Кнопка 3 (Слот 2)</div>
            <div class="form-group">
                <label for="optTitle2">Текст ответа (Оставьте пустым, если кнопка не нужна)</label>
                <input type="text" id="optTitle2" value="Goodbye">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="optType2">Действие (OptionType)</label>
                    <select id="optType2">
                        <option value="0">Закрыть диалог (0)</option>
                        <option value="1">Переход к диалогу (1)</option>
                        <option value="2">Роль (2)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="optDialog2">ID следующего диалога</label>
                    <input type="number" id="optDialog2" value="-1">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="optColor2">Цвет текста кнопки (Decimal)</label>
                    <input type="number" id="optColor2" value="14737632">
                </div>
                <div class="form-group">
                    <label for="optCmd2">Команда кнопки</label>
                    <input type="text" id="optCmd2" value="">
                </div>
            </div>
        </div>
    </div>

    <!-- Кнопка Скачать -->
    <button class="btn-download" onclick="generateAndDownload()">💾 Скачать файл диалога (.json)</button>
</div>

<script>
function generateAndDownload() {
    // Получение основных значений
    const dialogId = parseInt(document.getElementById('dialogId').value) || 1;
    const dialogTitle = document.getElementById('dialogTitle').value || "Start";
    const dialogText = document.getElementById('dialogText').value || "";
    
    // Безопасное получение опциональных полей (если их нет в вашем HTML, скрипт не упадет)
    const dialogQuestInput = document.getElementById('dialogQuest');
    const dialogQuest = dialogQuestInput ? (parseInt(dialogQuestInput.value) || -1) : -1;
    
    const dialogCommandInput = document.getElementById('dialogCommand');
    const dialogCommand = dialogCommandInput ? dialogCommandInput.value : "";
    
    const hideNpcInput = document.getElementById('dialogHideNPC');
    const dialogHideNPC = (hideNpcInput && hideNpcInput.checked) ? "1b" : "0b";
    
    const showWheelInput = document.getElementById('dialogShowWheel');
    const dialogShowWheel = (showWheelInput && showWheelInput.checked) ? "1b" : "0b";
    
    const disableEscInput = document.getElementById('dialogDisableEsc');
    const dialogDisableEsc = (disableEscInput && disableEscInput.checked) ? "1b" : "0b";

    // Сборка кнопок опций
    const options = [];
    for (let i = 0; i < 3; i++) {
        const titleEl = document.getElementById("optTitle" + i);
        if (titleEl && titleEl.value.trim() !== "") {
            const title = titleEl.value.trim();
            
            const typeEl = document.getElementById("optType" + i);
            const type = typeEl ? (parseInt(typeEl.value) || 0) : 0;
            
            const dialogEl = document.getElementById("optDialog" + i);
            const nextDialog = dialogEl ? (parseInt(dialogEl.value) || -1) : -1;
            
            const colorEl = document.getElementById("optColor" + i);
            const color = colorEl ? (parseInt(colorEl.value) || 14737632) : 14737632;
            
            const cmdEl = document.getElementById("optCmd" + i);
            const cmd = cmdEl ? cmdEl.value : "";

            options.push({
                "OptionSlot": i,
                "Option": {
                    "Title": title,
                    "OptionType": type,
                    "Dialog": nextDialog,
                    "DialogColor": color,
                    "DialogCommand": cmd
                }
            });
        }
    }

    // Полноценный оригинальный шаблон NBT-структуры автора мода
    const fullNbtStructure = {
        "DialogId": dialogId,
        "DialogTitle": dialogTitle,
        "DialogText": dialogText,
        "DialogQuest": dialogQuest,
        "DialogCommand": dialogCommand,
        "DialogMail": {
            "Subject": "",
            "Sender": "",
            "Time": "0L",
            "BeenRead": "0b",
            "Message": {},
            "TimePast": "1786471546922L",
            "MailQuest": -1,
            "MailItems": []
        },
        "DialogHideNPC": dialogHideNPC,
        "DialogShowWheel": dialogShowWheel,
        "DialogDisableEsc": dialogDisableEsc,
        "Options": options,
        "ModRev": 18,
        "AvailabilityDialog": 0,
        "AvailabilityDialog2": 0,
        "AvailabilityDialog3": 0,
        "AvailabilityDialog4": 0,
        "AvailabilityDialogId": -1,
        "AvailabilityDialog2Id": -1,
        "AvailabilityDialog3Id": -1,
        "AvailabilityDialog4Id": -1,
        "AvailabilityQuest": 0,
        "AvailabilityQuest2": 0,
        "AvailabilityQuest3": 0,
        "AvailabilityQuest4": 0,
        "AvailabilityQuestId": -1,
        "AvailabilityQuest2Id": -1,
        "AvailabilityQuest3Id": -1,
        "AvailabilityQuest4Id": -1,
        "AvailabilityFaction": 0,
        "AvailabilityFaction2": 0,
        "AvailabilityFactionStance": 0,
        "AvailabilityFaction2Stance": 0,
        "AvailabilityFactionId": -1,
        "AvailabilityFaction2Id": -1,
        "AvailabilityScoreboardObjective": "",
        "AvailabilityScoreboard2Objective": "",
        "AvailabilityScoreboardType": 1,
        "AvailabilityScoreboard2Type": 1,
        "AvailabilityScoreboardValue": 1,
        "AvailabilityScoreboard2Value": 1,
        "AvailabilityDayTime": 0,
        "AvailabilityMinPlayerLevel": 0,
        "OptionFactions1": -1,
        "OptionFactions2": -1,
        "OptionFaction1Points": 100,
        "OptionFaction2Points": 100,
        "DecreaseFaction1Points": "0b",
        "DecreaseFaction2Points": "0b"
    };

    // Сериализация в красивый JSON
    let jsonString = JSON.stringify(fullNbtStructure, null, 4);

    // Безопасный хак: заменяем строковые типы на NBT-литералы мода без опасных регулярок
    jsonString = jsonString.split('"0b"').join('0b');
    jsonString = jsonString.split('"1b"').join('1b');
    jsonString = jsonString.split('"0L"').join('0L');
    jsonString = jsonString.split('"1786471546922L"').join('1786471546922L');

    // Создание Blob и автоматическое скачивание файла
    const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "dialog_" + dialogId + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
</script>


</body>
</html>
