<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
:root {
    --bg-color: #1a1a1a;
    --panel-bg: #242424;
    --text-color: #e0e0e0;
    --accent-color: #4caf50;
    --section-bg: #2d2d2d; /* Фон для внутренних секций */
    --border-color: #444444; /* Цвет рамок */
}

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
.container {
    position: relative; /* ВАЖНО: держит иконки внутри серой рамки */
    width: 100%;
    max-width: 800px;
    background: var(--panel-bg);
    color: var(--text-color);
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    border: 1px solid var(--border-color);
}
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
.section {
    margin-bottom: 25px;
    background: var(--section-bg);
    border: 1px solid var(--border-color);
    border-left: 5px solid var(--accent-color); /* Та самая левая полоса! */
    padding: 15px;
    border-radius: 4px;
}
        .section-title {
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .option-block {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }
        .btn-download:hover {
            background-color: var(--accent-hover);
        }
        .btn-download:active {
            transform: scale(0.99);
        }
        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
		div[style*="position: absolute"] button:hover { transform: scale(1.2); }

    </style>
</head>
<body>

<!-- ГЛАВНАЯ ДИНАМИЧЕСКАЯ КНОПКА СКАЧИВАНИЯ -->
<!--button class="download-btn" id="mainDownloadButton" onclick="handleMainDownload()">💾 СКАЧАТЬ ФАЙЛ ДИАЛОГА (.JSON)</button !-->

<script>
// Функция вызова и скрытия всплывающего меню эмодзи на шестеренке
function toggleGearMenu(event) {
    if (event) event.stopPropagation(); // Запрещаем клику сворачивать основное окно
    
    const menu = document.getElementById('gearDropdownMenu');
    if (!menu) return;

    if (menu.style.display === 'none' || menu.style.display === '') {
        menu.style.display = 'flex'; // Показываем свиток и замочек в ряд
    } else {
        menu.style.display = 'none';
    }
}

// Измененная функция для замочка: открывает панель условий доступности
function toggleAdvancedSettings(event) {
    if (event) event.stopPropagation();
    
    const advBlock = document.getElementById('advancedSettingsBlock');
    if (!advBlock) return;

    if (advBlock.style.display === 'none') {
        advBlock.style.display = 'block';
        advBlock.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
        advBlock.style.display = 'none';
    }
    
    // Прячем меню шестеренки после выбора действия, чтобы не мешалось
    document.getElementById('gearDropdownMenu').style.display = 'none';
}

// ВРЕМЕННАЯ ФУНКЦИЯ-ЗАГЛУШКА ДЛЯ СВИТКА (Для добавления второго диалога)
// Счетчик для уникальных ID дополнительных диалогов в ленте
let extraDialogCount = 0;

function createNewDialogChainBlock(event) {
    if (event) event.stopPropagation(); // Изолируем клик, чтобы не сворачивать окно
    
    // Прячем меню шестеренки
    const gearMenu = document.getElementById('gearDropdownMenu');
    if (gearMenu) gearMenu.style.display = 'none';

    // Находим главный контейнер страницы, куда вшиты все разделы, чтобы добавить блок ниже
    const container = document.querySelector('.container');
    if (!container) return;

    extraDialogCount++;
    const currentExtraId = extraDialogCount;

    // Рассчитываем ID для нового диалога (берём дефолтный из верхнего поля и прибавляем счетчик)
    const baseIdVal = parseInt(document.getElementById('dialogId').value) || 1;
    const nextDialogId = baseIdVal + currentExtraId;

    const extraBlock = document.createElement('div');
    extraBlock.className = 'section';
    extraBlock.id = `extraDialogBlock_${currentExtraId}`;
    extraBlock.style.cssText = "margin-top: 25px; border-left: 5px solid var(--accent-color); position: relative;";

    // Генерируем структуру нового независимого диалога с кнопкой скачивания в шапке!
    extraBlock.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; user-select: none;">
            <div class="section-title" style="margin: 0; cursor: pointer;" onclick="document.getElementById('extraParamsWrapper_${currentExtraId}').style.display = document.getElementById('extraParamsWrapper_${currentExtraId}').style.display === 'none' ? 'flex' : 'none'">
                ▼ Дополнительный диалог №${currentExtraId + 1} (ID: ${nextDialogId})
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <!-- ЛИЧНАЯ КНОПКА СКАЧИВАНИЯ ЭТОЙ ВЕТКИ -->
                <button type="button" onclick="downloadExtraDialogJson(${currentExtraId})" title="Скачать этот диалог (.json)" style="background: none; border: none; font-size: 16px; cursor: pointer; padding: 2px;">💾</button>
                <span onclick="document.getElementById('extraDialogBlock_${currentExtraId}').remove()" title="Удалить этот диалог" style="font-size: 14px; cursor: pointer; color: #ff3333;">❌</span>
            </div>
        </div>
        
        <div id="extraParamsWrapper_${currentExtraId}" style="display: flex; flex-direction: column; gap: 15px;">
            <div class="form-row">
                <div class="form-group">
                    <label>ID Диалога (DialogId)</label>
                    <input type="number" id="extraDialogId_${currentExtraId}" value="${nextDialogId}">
                </div>
                <div class="form-group">
                    <label>Название диалога (DialogTitle)</label>
                    <input type="text" id="extraDialogTitle_${currentExtraId}" value="Chain Part ${currentExtraId + 1}">
                </div>
            </div>
            <div class="form-group">
                <label>Текст NPC (DialogText)</label>
                <textarea id="extraDialogText_${currentExtraId}" placeholder="Что скажет NPC...">Продолжение истории...</textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>ID Квеста (-1 если нет)</label>
                    <input type="number" id="extraDialogQuest_${currentExtraId}" value="-1">
                </div>
                <div class="form-group">
                    <label>Консольная команда при открытии</label>
                    <input type="text" id="extraDialogCommand_${currentExtraId}" value="">
                </div>
            </div>
        </div>
    `;

    // Вставляем новый блок перед самой главной нижней кнопкой скачивания
    const mainBtn = document.getElementById('mainDownloadButton') || document.querySelector('.download-btn');
    if (mainBtn) {
        container.insertBefore(extraBlock, mainBtn);
    } else {
        container.appendChild(extraBlock);
    }

    // Принудительно подкрашиваем новые элементы в цвет активной ретро-темы страницы
    const savedTheme = localStorage.getItem('customNpcTheme') || 'ifindit';
    if (typeof setTheme === 'function') setTheme(savedTheme);
}



function setTheme(theme) {
    // Сбрасываем лишние верхние полосы-разделители
    const headerRow = document.querySelector('.header-row');
    if (headerRow) headerRow.style.borderBottom = 'none';

    localStorage.setItem('customNpcTheme', theme);

    const root = document.documentElement;
    const body = document.body;
    const container = document.querySelector('.container');
    const mainTitle = document.getElementById('mainTitle') || document.querySelector('h1');
    const downloadBtn = document.querySelector('.download-btn');
    const labels = document.querySelectorAll('label');
    const sectionTitles = document.querySelectorAll('.section-title, h2, h3');
    const optionsTitle = document.getElementById('optionsTitle');
    const btnDeleteLast = document.getElementById('btnDeleteLast');

    // Сброс ретро-текстуры MelonKing
    body.style.backgroundImage = 'none';

    if (theme === 'pipboy') {
        body.style.backgroundColor = '#1a1a1a';
        body.style.color = '#e0e0e0';
        if(container) { 
            container.style.backgroundColor = '#242424'; 
            container.style.border = '1px solid #444444'; 
            container.style.boxShadow = '0 4px 15px rgba(0,0,0,0.5)'; // ЖЕСТКИЙ СБРОС БЕЛОЙ ТЕНИ
        }
        if(mainTitle) mainTitle.style.color = '#4caf50';
        if(downloadBtn) downloadBtn.style.backgroundColor = '#4caf50';
        if(btnDeleteLast) { btnDeleteLast.style.backgroundColor = '#e0a800'; btnDeleteLast.style.color = '#000'; btnDeleteLast.style.border = '1px solid rgba(0,0,0,0.2)'; btnDeleteLast.style.boxShadow = 'none'; }

// Интеллектуальный поиск слов с лупой а-ля Notepad++
// Переменные для слежения за индексами совпадений поиска
let searchMatches = [];
let currentMatchIndex = -1;

// Функция сканирования текста при вводе
function searchInNotes() {
    const query = document.getElementById('notesSearchInput').value.toLowerCase();
    const notesField = document.getElementById('authorNotes');
    const status = document.getElementById('notesSearchStatus');
    if (!notesField || !status) return;

    const text = notesField.value.toLowerCase();
    searchMatches = []; // Сбрасываем старые совпадения
    currentMatchIndex = -1;

    if (query.trim() === "" || query.length < 2) {
        status.textContent = "Notepad++ v0.1";
        status.style.color = 'inherit';
        return;
    }

    // Ищем все вхождения слова в текст и сохраняем их позиции
    let pos = text.indexOf(query);
    while (pos !== -1) {
        searchMatches.push(pos);
        pos = text.indexOf(query, pos + 1);
    }

    // Выводим статус совпадений
    if (searchMatches.length > 0) {
        status.style.color = 'inherit';
        status.textContent = `Найдено совпадений: ${searchMatches.length}`;
    } else {
        status.style.color = '#ff3333';
        status.textContent = "Совпадений не найдено";
    }
}

// Интеллектуальный переход к слову по стрелочкам с фокусом и автоскроллом
function navigateSearch(direction) {
    const query = document.getElementById('notesSearchInput').value;
    const notesField = document.getElementById('authorNotes');
    const status = document.getElementById('notesSearchStatus');
    if (!notesField || searchMatches.length === 0) return;

    // Сдвигаем индекс вперед или назад по кругу
    currentMatchIndex += direction;
    if (currentMatchIndex >= searchMatches.length) currentMatchIndex = 0;
    if (currentMatchIndex < 0) currentMatchIndex = searchMatches.length - 1;

    const startPos = searchMatches[currentMatchIndex];
    const endPos = startPos + query.length;

    // Фокусируемся на поле и выделяем найденное слово курсором
    notesField.focus();
    notesField.setSelectionRange(startPos, endPos);

    // Расчет автоскролла: сдвигаем ползунок блокнота прямо к выделенному слову
    const lineHeight = 18; // Примерная высота строки в пикселях
    const textBefore = notesField.value.substring(0, startPos);
    const lineNumber = textBefore.split('\n').length;
    notesField.scrollTop = (lineNumber - 2) * lineHeight;

    // Обновляем плашку статуса внизу (например: [1 из 4])
    if(status) {
        status.textContent = `Совпадение: ${currentMatchIndex + 1} из ${searchMatches.length}`;
    }
}

function generateAndDownload() {
    // Безопасное чтение базовых инпутов с защитой от пустых значений (null)
    const dIdEl = document.getElementById('dialogId');
    const dTitleEl = document.getElementById('dialogTitle');
    const dTextEl = document.getElementById('dialogText');
    const dQuestEl = document.getElementById('dialogQuest');
    const dCmdEl = document.getElementById('dialogCommand');

    const dialogId = dIdEl ? (parseInt(dIdEl.value) || 1) : 1;
    const dialogTitle = dTitleEl ? (dTitleEl.value || "Start") : "Start";
    const dialogText = dTextEl ? (dTextEl.value || "") : "";
    const dialogQuest = dQuestEl ? (parseInt(dQuestEl.value) || -1) : -1;
    const dialogCommand = dCmdEl ? dCmdEl.value : "";
    
    // Безопасное чтение чекбоксов настроек окна
    const hideNpcEl = document.getElementById('dialogHideNPC');
    const showWheelEl = document.getElementById('dialogShowWheel');
    const disableEscEl = document.getElementById('dialogDisableEsc');

    const dialogHideNPC = (hideNpcEl && hideNpcEl.checked) ? "1b" : "0b";
    const dialogShowWheel = (showWheelEl && showWheelEl.checked) ? "1b" : "0b";
    const dialogDisableEsc = (disableEscEl && disableEscEl.checked) ? "1b" : "0b";

    // Сборка кнопок ответов игрока (Опции)
    const options = [];
    for (let i = 0; i < 3; i++) {
        const titleInput = document.getElementById('optTitle' + i);
        
        // Если поле текста кнопки существует и оно не пустое — собираем данные кнопки
        if (titleInput && titleInput.value.trim() !== "") {
            const title = titleInput.value.trim();
            
            // Защищенное считывание остальных полей кнопки (даже если id поменялись, скрипт не упадет)
            const typeInput = document.getElementById('optType' + i) || document.getElementById('optAction' + i);
            const dialogInput = document.getElementById('optDialog' + i) || document.getElementById('optNext' + i);
            const colorInput = document.getElementById('optColor' + i);
            const cmdInput = document.getElementById('optCmd' + i) || document.getElementById('optCommand' + i);

            const type = typeInput ? (parseInt(typeInput.value) || 0) : 0;
            const nextDialog = dialogInput ? (parseInt(dialogInput.value) || -1) : -1;
            const color = colorInput ? (parseInt(colorInput.value) || 14737632) : 14737632;
            const cmd = cmdInput ? cmdInput.value : "";

            options.push({
                "OptionSlot": i,
                "Option": {
                    "Title": title,
                    "OptionType": type,
                    "Dialog": nextDialog,
                    "DialogColor": color,
                    "DialogCommand": cmd
                }
            });
        }
    }

    // Каноничный шаблон структуры CustomNPCs
    const fullNbtStructure = {
        "DialogId": dialogId,
        "DialogTitle": dialogTitle,
        "DialogText": dialogText,
        "DialogQuest": dialogQuest,
        "DialogCommand": dialogCommand,
        "DialogMail": {

            "Message": {},
            "TimePast": "1786471546922L",

        },

        "DialogShowWheel": dialogShowWheel,

        "ModRev": 18,
        "AvailabilityDialog": 0,

        "AvailabilityDialogId": -1,
        "AvailabilityDialog2Id": -1,

    };

    // Сериализация и хак типов NBT под требования CustomNPCs
    let jsonString = JSON.stringify(fullNbtStructure, null, 4);
    jsonString = jsonString.split('"0b"').join('0b');

// Функция быстрой очистки верхнего текстового поля NPC
function clearNpcTextField() {
    const dialogText = document.getElementById('dialogText');
    if (dialogText) {
        if (dialogText.value.trim() !== "") {
            if (confirm("Вы уверены, что хотите полностью стереть текст реплики NPC?")) {
                dialogText.value = "";
            }
        }
    }
}
// Функция точечного скачивания дополнительного диалога из ленты
function downloadExtraDialogJson(extraId) {
    const dialogId = parseInt(document.getElementById(`extraDialogId_${extraId}`).value) || 1;
    const dialogTitle = document.getElementById(`extraDialogTitle_${extraId}`).value || "Chain Part";
    const dialogText = document.getElementById(`extraDialogText_${extraId}`).value || "";
    const dialogQuest = parseInt(document.getElementById(`extraDialogQuest_${extraId}`).value) || -1;
    const dialogCommand = document.getElementById(`extraDialogCommand_${extraId}`).value || "";

    // Используем монолитный каноничный шаблон автора под требования NBT-JSON мода
    const structure = {
        "DialogId": dialogId,
        "DialogTitle": dialogTitle,
        "DialogText": dialogText,
        "DialogQuest": dialogQuest,
        "DialogCommand": dialogCommand,
        "DialogMail": { "Subject": "", "Sender": "", "Time": "0L", "BeenRead": "0b", "Message": {}, "TimePast": "1786471546922L", "MailQuest": -1, "MailItems": [] },
        "DialogHideNPC": "0b", "DialogShowWheel": "0b", "DialogDisableEsc": "0b",

        "ModRev": 18,

        "AvailabilityScoreboardObjective": "", "AvailabilityScoreboard2Objective": "", "AvailabilityScoreboardType": 1, "AvailabilityScoreboard2Type": 1, "AvailabilityScoreboardValue": 1, "AvailabilityScoreboard2Value": 1,
        "AvailabilityDayTime": 0, "AvailabilityMinPlayerLevel": 0,

    // Сериализация и чистка строковых типов под литералы CustomNPCs (0b, L)

    // Автоматический выброс файла в браузер

}
